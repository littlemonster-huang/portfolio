<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>HKB Tech 独立站 · 全流程取证 · 黄科斌</title>
<style>
:root{--bg:#F3F4F6;--card:#fff;--line:#E5E7EB;--text:#111827;--muted:#6B7280;--amber:#B45309;--amber-bg:#FFFBEB}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.75;padding:28px 16px 60px}
.wrap{max-width:1080px;margin:0 auto}
header{text-align:center;margin-bottom:6px}
h1{font-size:23px;font-weight:800}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
.sub b{color:var(--amber)}
.notice{background:var(--amber-bg);border:1px solid #FDE68A;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#92400E;margin:16px auto 24px;max-width:900px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
figure{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:zoom-in;transition:box-shadow .2s,transform .2s}
figure:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translateY(-2px)}
figure img{width:100%;display:block}
figcaption{padding:9px 13px;font-size:12.5px;color:var(--text);border-top:1px solid var(--line)}
figcaption b{color:var(--amber)}
.hint{font-size:11px;color:var(--muted);text-align:center;margin:0 0 14px}
/* 点击放大层 */
#lightbox{display:none;position:fixed;inset:0;z-index:999;background:rgba(17,24,39,.88);cursor:zoom-out;align-items:center;justify-content:center;padding:28px}
#lightbox.on{display:flex}
#lightbox img{max-width:96vw;max-height:92vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#lightbox .cap{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#F9FAFB;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 20px}
#lightbox .x{position:fixed;top:14px;right:20px;color:#F9FAFB;font-size:30px;line-height:1;cursor:pointer;user-select:none}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:26px}
</style>
</head>

<div id="lightbox"><span class="x">&times;</span><img src="" alt=""><div class="cap"></div></div>
<script>
(function(){
  var lb=document.getElementById('lightbox'),
      lbImg=lb.querySelector('img'),
      lbCap=lb.querySelector('.cap');
  document.querySelectorAll('.grid figure').forEach(function(f){
    f.addEventListener('click',function(){
      var img=f.querySelector('img');
      lbImg.src=img.src;
      lbCap.textContent=img.getAttribute('data-cap')||'';
      lb.classList.add('on');
      document.body.style.overflow='hidden';
    });
  });
  function close(){lb.classList.remove('on');document.body.style.overflow='';}
  lb.addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
</script>

</html>
